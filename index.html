<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Audio-reaktiver Techno-Visualizer fürs Mikrofon" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Vibecode Visualizer</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="start">
      <h1>VIBECODE<span>//</span>VISUALIZER</h1>
      <div class="actions">
        <button id="btn-mic">START · MIKROFON</button>
        <button id="btn-demo" class="secondary">DEMO-BEAT</button>
      </div>
      <p id="start-error" role="alert"></p>
      <p class="hint">Chrome empfohlen · F = Vollbild · H = Hilfe</p>
    </div>

    <pre id="hud" hidden></pre>

    <div id="control" hidden>
      <div class="row">
        <label for="sync">SYNC</label>
        <input id="sync" type="range" step="5" value="0" list="sync-ticks" />
        <datalist id="sync-ticks"><option value="0"></option></datalist>
        <output id="sync-value">0 ms</output>
        <button id="sync-reset" title="Auf 0 ms zurücksetzen">0</button>
        <span id="beat-lamp" title="Blinkt auf dem Beat, wie das Bild ihn sieht"></span>
      </div>
      <div class="scale"><span>← BILD FRÜHER</span><span>BILD SPÄTER →</span></div>
      <div class="row">
        <label>FARBE</label>
        <div id="palettes"></div>
        <span id="palette-name"></span>
      </div>
      <div class="row">
        <label class="check"><input id="cam-enabled" type="checkbox" /> WEBCAM</label>
        <button id="cam-hold" title="Bleibt drin, bis du nochmal klickst (Taste V)">EIN/AUS</button>
        <button id="cam-short" title="Einblendung für 5–10 s (Shift+V)">KURZ</button>
        <span id="cam-status"></span>
      </div>
    </div>
    <div id="toast"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
